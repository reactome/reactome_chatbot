$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  features:
    type: object
    properties:
      postprocessing:
        type: object
        properties:
          enabled:
            type: boolean
          user_group:
            type: string
            enum: ["all", "logged_in"]
        required: ["enabled"]
    required: ["postprocessing"]
  llm:
    # The answering model. Every field is optional; an absent `llm:` section
    # leaves behaviour exactly as it was. There is deliberately no embedding
    # model here -- it is derived from the installed bundle, because a query
    # embedded with a different model than built the vectors returns nonsense
    # rather than an error.
    type: object
    properties:
      provider:
        type: string
        enum: ["openai", "ollama"]
      model:
        type: string
        description: "e.g. gpt-4o-mini, gpt-5.6-luna. LLM_MODEL overrides this."
      base_url:
        type: string
        description: "OpenAI-compatible endpoint, for self-hosted models."
      temperature:
        type: number
        description: >-
          Almost always leave unset: the value a model requires is derived. Set
          it only for a model the derived table has not met. A value the model
          refuses stops the server at startup.
    additionalProperties: false
  messages:
    type: object
    additionalProperties:
      type: object
      properties:
        message:
          type: string
        enabled:
          type: boolean
        recipients:
          type: array
          items:
            type: string
            oneOf:
              - pattern: "@.+\\..+"
              - enum: ["all", "logged_in", "guests"]
        trigger:
          type: object
          properties:
            event:
              type: string
              enum: ["on_chat_start", "on_chat_end", "on_chat_resume", "on_message"]
            after_messages:
              type: integer
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
            freq_max:
              type: string
              pattern: "^[0-9]+[smhdw]$"
          anyOf:
            - required: ["event"]
            - required: ["after_messages"]
      required: ["message", "trigger"]
  profiles:
    type: array
    items:
      type: string
      enum: ["React-to-Me", "Cross-Database Prototype", "Plant Reactome"]
  usage_limits:
    type: object
    properties:
      message_rates:
        type: array
        items:
          type: object
          properties:
            users:
              type: array
              items:
                type: string
                oneOf:
                  - pattern: "@.+\\..+"
                  - enum: ["all", "logged_in", "guests"]
            max_messages:
              type: integer
            interval:
              type: string
              pattern: "^[0-9]+[smhdw]$"
          required: ["users", "max_messages", "interval"]
    required: ["message_rates"]
required: ["features", "messages", "profiles", "usage_limits"]
