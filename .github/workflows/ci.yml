name: reactome_chatbot CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
    lint:
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python and Poetry
              uses: ./.github/actions/install_python_poetry

            - name: Run linters
              run: |
                  poetry run ruff check .
                  poetry run mypy .
                  poetry run isort --check .

    poetry-check:
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-15-intel]

        steps:
            - uses: actions/checkout@v4

            - name: Check poetry.lock for changes
              id: check-poetry-lock
              uses: tj-actions/changed-files@v45
              with:
                  files: poetry.lock

            - name: Set up Python and Poetry
              if: steps.check-poetry-lock.outputs.any_changed == 'true'
              uses: ./.github/actions/install_python_poetry

            - name: Verify Python imports
              if: steps.check-poetry-lock.outputs.any_changed == 'true'
              env:
                  PYTHONPATH: ./bin:./src
              run: |
                poetry check
                poetry run python ./.github/actions/verify_imports.py

    docker-build-push:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}

        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract build metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                tags: |
                  type=semver,pattern={{version}}
                  type=sha,format=short,prefix=

            - name: Login to Docker registry ${{ env.REGISTRY }}
              if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published')
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build (and push) Docker image
              uses: docker/build-push-action@v6
              with:
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published') }}
                outputs: type=docker,dest=/tmp/image.tar
                provenance: mode=max
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - uses: actions/upload-artifact@v4
              with:
                name: image-artifact
                path: /tmp/image.tar
